<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>庄子 · 一则一画</title>
<link rel="stylesheet" href="site.css">
<style>
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 18px 60px; }
  header.hero { text-align: center; padding: 64px 0 24px; }
  header.hero h1 { font-family: var(--kai); font-weight: normal; font-size: 84px; letter-spacing: .2em; margin: 0; }
  header.hero .seal {
    display: inline-block; border: 2px solid var(--red); color: var(--red); font-family: var(--kai);
    padding: 2px 6px; font-size: 15px; border-radius: 3px; transform: rotate(-4deg); vertical-align: middle;
  }
  header.hero p { color: var(--ink2); line-height: 1.9; max-width: 560px; margin: 14px auto 0; }

  .feature {
    display: flex; gap: 18px; align-items: center; text-decoration: none; color: inherit;
    background: var(--paper2); border-radius: 14px; overflow: hidden; margin: 18px 0 8px;
    box-shadow: inset 0 0 40px rgba(90,60,20,.10);
  }
  .feature img { width: 42%; max-width: 380px; aspect-ratio: 16/9; object-fit: cover; display: block; }
  .feature div { padding: 14px 18px 14px 0; }
  .feature b { font-family: var(--kai); font-weight: normal; font-size: 28px; display: block; }
  .feature span { color: var(--ink2); font-size: 14px; line-height: 1.7; }
  .feature em { font-style: normal; color: var(--red); font-size: 13px; display: inline-block; margin-top: 6px; }

  .search { display: flex; justify-content: center; margin: 26px 0 6px; }
  .search input {
    width: min(460px, 100%); font-family: var(--song); font-size: 16px; padding: 10px 16px;
    border: 1px solid rgba(0,0,0,.2); border-radius: 999px; background: rgba(255,255,255,.5); color: var(--ink);
  }
  .stat { text-align: center; color: var(--ink3); font-size: 13px; }

  h2.part { font-family: var(--kai); font-weight: normal; font-size: 30px; margin: 40px 0 4px; display: flex; align-items: baseline; gap: 12px; }
  h2.part small { font-family: var(--song); font-size: 13px; color: var(--ink3); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-top: 12px; }
  .card {
    background: rgba(255,255,255,.32); border: 1px solid rgba(0,0,0,.1); border-radius: 12px; padding: 16px 18px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .card.off { opacity: .5; }
  .card a.title { text-decoration: none; color: var(--ink); display: flex; align-items: baseline; gap: 8px; }
  .card a.title b { font-family: var(--kai); font-weight: normal; font-size: 26px; }
  .card a.title span { color: var(--ink3); font-size: 12px; }
  .card p { margin: 0; color: var(--ink2); font-size: 14px; line-height: 1.7; }
  .stories { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .stories a {
    font-family: var(--kai); font-size: 14px; color: var(--ink); text-decoration: none;
    border: 1px solid rgba(0,0,0,.14); border-radius: 999px; padding: 2px 10px; background: rgba(255,255,255,.4);
  }
  .stories a:hover, .stories a.hit { border-color: var(--red); color: var(--red); }
  .stories a.ill::after { content: " 画"; color: var(--red); font-size: 11px; }
  .hidden { display: none !important; }

  @media (max-width: 600px) {
    header.hero h1 { font-size: 60px; }
    .feature { flex-direction: column; align-items: stretch; }
    .feature img { width: 100%; max-width: none; }
    .feature div { padding: 0 16px 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>庄子</h1>
    <span class="seal">逐句白话</span>
    <p>三十三篇，六万五千字。每一句原文下面都有白话；读不出的字标了拼音，读不懂的词点一下就有解释。</p>
  </header>

  <a class="feature" href="paoding.html">
    <img src="img/flow/cover_dance_1.jpg" alt="庖丁解牛水墨插画">
    <div>
      <b>庖丁解牛 · 插画朗读版</b>
      <span>水墨插画、逐句朗读、画面跟着故事走。全书都会慢慢做成这个样子。</span><br>
      <em>进入 →</em>
    </div>
  </a>

  <div class="search"><input id="q" type="search" placeholder="找故事：比如 鲲鹏、蝴蝶、井底、濠梁……"></div>
  <div class="stat" id="stat"></div>
  <div id="list"></div>
</div>
<footer class="foot">原文：《庄子》维基文库本（公版） · 白话与注释为本站原创，AI 起稿，尚未逐条人工校对</footer>

<script>
(async () => {
  const idx = await (await fetch("data/index.json")).json();
  const ready = idx.filter(c => c.ready).length;
  document.getElementById("stat").textContent = `已完成 ${ready} / ${idx.length} 篇`;
  const PARTS = [["内篇", "庄子本人所作，全书核心"], ["外篇", "多为门人后学所作"], ["杂篇", "门人后学所作，内容最杂"]];
  const list = document.getElementById("list");
  list.innerHTML = PARTS.map(([p, note]) => `
    <section data-part="${p}">
      <h2 class="part">${p}<small>${note}</small></h2>
      <div class="grid">${idx.filter(c => c.part === p).map(c => `
        <div class="card ${c.ready ? "" : "off"}" data-key="${c.key}">
          <a class="title" href="${c.ready ? `reader.html?c=${c.key}` : "#"}"><b>${c.title}</b><span>第 ${c.n} 篇 · ${c.chars} 字${c.ready ? "" : " · 制作中"}</span></a>
          ${c.ready ? `<p>${c.intro}</p>
          <div class="stories">${c.sections.map((s, i) =>
            `<a href="${s.illustrated || `reader.html?c=${c.key}#s${i + 1}`}" class="${s.illustrated ? "ill" : ""}">${s.title}</a>`).join("")}</div>` : ""}
        </div>`).join("")}
      </div>
    </section>`).join("");

  // 搜故事：按小标题、篇名、简介筛
  const q = document.getElementById("q");
  q.oninput = () => {
    const k = q.value.trim();
    document.querySelectorAll(".card").forEach(card => {
      const c = idx.find(x => x.key === card.dataset.key);
      const hay = [c.title, c.intro || "", ...(c.sections || []).map(s => s.title)].join(" ");
      card.classList.toggle("hidden", !!k && !hay.includes(k));
      card.querySelectorAll(".stories a").forEach(a => a.classList.toggle("hit", !!k && a.textContent.includes(k)));
    });
    document.querySelectorAll("section[data-part]").forEach(s =>
      s.classList.toggle("hidden", !s.querySelector(".card:not(.hidden)")));
  };
})();
</script>
</body>
</html>
